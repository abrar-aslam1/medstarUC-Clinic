[build]
  publish = "."
  # Validates only -- never rewrites. The generated pages are committed, so
  # this serves them as-is; it just refuses to deploy if any page has
  # drifted from partials/. A failure leaves the previous deploy live.
  command = "npm run check"

[build.environment]
  NODE_VERSION = "20"

# Only one function: the careers form emails the resume as an attachment and
# then deletes Netlify's public copy. See netlify/functions/submission-created.mjs
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Security headers applied to every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    # google* entries exist only so gtag.js can load and beacon (see
    # scripts/analytics.js). Remove them and analytics silently stops --
    # the page keeps working, the hits just never leave the browser.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# Static assets are content-stable; cache them hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
